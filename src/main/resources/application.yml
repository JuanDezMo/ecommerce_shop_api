spring:
  application:
    name: shop-backend

  # La conexión llega por variables de entorno (SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD),
  # como las define docker-compose.yml. El perfil dev usa localhost (application-dev.yml).

  # JPA (§11.1): el esquema lo controla solo Flyway
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # JSON estricto (§9.3): "2" no es un entero, "true" no es un booleano y 1.5 no es un entero
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false

# JWT (§8.4): el secreto llega por la variable de entorno JWT_SECRET. Si falta o mide menos de 32 bytes,
# la aplicación no arranca (JwtProperties). El TTL se puede cambiar por perfil.
jwt:
  secret: ${JWT_SECRET:}
  ttl: 1h

# Actuator: solo /actuator/health, sin detalles internos (specs/service-health)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
